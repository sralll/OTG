<svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>

<script type="module">
import { generateWards } from './src/core/CityGen.js?v=31';
import { extractObstacles, thickenPolyline } from './src/core/Obstacles.js?v=7';
import { buildVisibilityGraph, dilatePolygon } from './src/core/VisibilityGraph.js?v=12';

let visibilityGraph = null;
const ROUTE_VISIBILITY_GRAPH_OPTIONS = {
	// Physical runner clearance: routes keep this far from every wall. The route
	// hugs the DILATED corner (clearance out from the true wall), which is the
	// correct shortest path under a real body/safety margin — not a detour. The
	// earlier suboptimality was the _diagonalBlocked over-block (now fixed) plus
	// route-steering penalties (now removed), not the clearance itself.
	clearance: 0.3,
	// PERF-EXPERIMENT: reduced from 16 to 8 for stress testing. Undo by restoring
	// neighborRing: 16 if route quality drops on long tangent/open routes.
	neighborRing: 8,
};

const SVGNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const vp = document.getElementById('vp');
const statusEl = document.getElementById('status');
const $ = (id) => document.getElementById(id);

const PALETTE = {
	innerFill: '#e4d7b6', innerStroke: '#9a8a63',   // city wards
	outerFill: '#cdd6ac', outerStroke: '#9aa877',   // countryside wards
	waterFill: '#00adef', waterStroke: '#000000',   // sea / lakes
	river: '#00adef', riverBank: '#000000',         // river / canal
	wall: '#888888', wallOutline: '#000000', gate: '#efe9d8', gateTower: '#c8c8c8',
	bridgeDock: '#c8a46a', bridgeDockOutline: '#000000',
	seed: '#c0392b',
	block: '#000000',
	building: '#888888', buildingStroke: '#000000',
	plazaBuilding: '#888888',
	outerGarden: '#a6b93c',
	cathedralGround: '#fdc01d',
	park: '#fdc01d', parkStroke: '#000000',
	largestLotInset: '#c8c8c8',
	cathedral: '#888888', cathedralStroke: '#000000',
	cathedralWall: '#000000',
	hedge: '#009218',
	alley: '#a99d77',
	// Orienteering landmarks dropped into chamfered corner gaps.
	featureObject: '#000', featureTree: '#009218', featureFountain: '#2b7fc4'};
const RIVER_BANK_SCALE = 1.3;
const BUILDING_OUTLINE_WIDTH = 0.18;
const GATE_TOWER_OUTLINE_WIDTH = BUILDING_OUTLINE_WIDTH / 2;
const WALL_TOWER_DIAMETER_SCALE = 2;
const WATER_OUTLINE_WIDTH = 0.2;
const HEDGE_WIDTH = 0.45;
const BRIDGE_FILL_WIDTH = 1.6;

let data = null, bounds = null;

// Chaikin's corner-cutting (reference: Hf.render / com.watabou.geom.Chaikin).
// Each interior vertex is replaced by two points 1/4 toward each neighbour;
// endpoints are preserved. 3 iterations matches the reference river rendering.
function chaikinSmooth(pts, iterations) {
	if (pts.length < 3) return pts;
	let a = pts;
	for (let it = 0; it < iterations; it++) {
		const h = [a[0]];
		for (let i = 1, n = a.length - 1; i < n; i++) {
			const g = a[i], p = a[i - 1], nx = a[i + 1];
			h.push({ x: g.x * 0.75 + p.x * 0.25, y: g.y * 0.75 + p.y * 0.25 });
			h.push({ x: g.x * 0.75 + nx.x * 0.25, y: g.y * 0.75 + nx.y * 0.25 });
		}
		h.push(a[a.length - 1]);
		a = h;
	}
	return a;
}

function polyPath(pts) {
	if (pts.length < 2) return '';
	return 'M' + pts.map(p => p.x + ',' + p.y).join('L');
}

function dist(a, b) {
	return Math.hypot(a.x - b.x, a.y - b.y);
}

function wardBaseFill(w) {
	const outerCity = w.type === 'outerGarden' || w.type === 'outerHighrise';
	return w.water ? PALETTE.waterFill : (w.inner || outerCity) ? PALETTE.innerFill : PALETTE.outerFill;
}

function polygonPath(poly) {
	if (!poly || poly.length < 3) return '';
	return `M${poly.map((p) => `${p.x},${p.y}`).join('L')}Z`;
}

// Two-pass water rendering: draw the dark outline strokes first (behind), then
// the blue fills on top. This reproduces the old feMorphology(dilate) filter
// exactly — the fill covers the inward half of each outline stroke, leaving
// only a 0.2 outward dark ring visible — but as pure vector geometry with no
// fullscreen raster, so pan/zoom never triggers a re-paint.
function drawWaterBody(wards, river, riverGeometry, mapBounds) {
	let d = '';
	for (const w of wards || []) if (w.water) d += polygonPath(w.polygon);
	if (riverGeometry?.delta) d += deltaPath(riverGeometry.delta);
	const hasRiver = riverGeometry && river?.width;
	const outlineWidth = WATER_OUTLINE_WIDTH * 2;

	if (d) {
		const outline = document.createElementNS(SVGNS, 'path');
		outline.setAttribute('d', d);
		outline.setAttribute('fill', 'none');
		outline.setAttribute('stroke', PALETTE.waterStroke);
		outline.setAttribute('stroke-width', outlineWidth);
		outline.setAttribute('stroke-linejoin', 'round');
		vp.appendChild(outline);
	}
	if (hasRiver) {
		const outline = document.createElementNS(SVGNS, 'path');
		outline.setAttribute('d', riverGeometry.pathD);
		outline.setAttribute('fill', 'none');
		outline.setAttribute('stroke', PALETTE.waterStroke);
		outline.setAttribute('stroke-width', river.width + outlineWidth);
		outline.setAttribute('stroke-linecap', river.delta ? 'butt' : 'round');
		outline.setAttribute('stroke-linejoin', 'round');
		vp.appendChild(outline);
	}

	if (d) {
		const water = document.createElementNS(SVGNS, 'path');
		water.setAttribute('d', d);
		water.setAttribute('fill', PALETTE.waterFill);
		water.setAttribute('stroke', 'none');
		vp.appendChild(water);
	}
	if (hasRiver) {
		const riverFill = document.createElementNS(SVGNS, 'path');
		riverFill.setAttribute('d', riverGeometry.fillPathD || riverGeometry.pathD);
		riverFill.setAttribute('fill', 'none');
		riverFill.setAttribute('stroke', PALETTE.river);
		riverFill.setAttribute('stroke-width', river.width);
		riverFill.setAttribute('stroke-linecap', river.delta ? 'butt' : 'round');
		riverFill.setAttribute('stroke-linejoin', 'round');
		vp.appendChild(riverFill);
	}
}

function previewDeltaFromPath(delta, path, width) {
	if (!delta || path.length < 2) return delta;
	const p0 = path[0], p1 = path[1];
	const dx = p1.x - p0.x, dy = p1.y - p0.y;
	const len = Math.hypot(dx, dy) || 1;
	const tx = dx / len, ty = dy / len;
	const hw = width / 2;
	const a = { x: p0.x - ty * hw, y: p0.y + tx * hw };
	const b = { x: p0.x + ty * hw, y: p0.y - tx * hw };
	const right = dist(a, delta.right) <= dist(b, delta.right) ? a : b;
	const left = right === a ? b : a;
	const ctrlLen = Math.max(dist(delta.right, delta.rightCtrl1), len * 0.5);
	return {
		...delta,
		right,
		rightCtrl1: { x: right.x - tx * ctrlLen, y: right.y - ty * ctrlLen },
		leftCtrl2: { x: left.x - tx * ctrlLen, y: left.y - ty * ctrlLen },
		left,
	};
}

function deltaPath(dl) {
	let d = `M${dl.right.x},${dl.right.y}`;
	d += ` C${dl.rightCtrl1.x},${dl.rightCtrl1.y} ${dl.rightCtrl2.x},${dl.rightCtrl2.y} ${dl.prevShore.x},${dl.prevShore.y}`;
	if (dl.isConvex) d += ` L${dl.mouth.x},${dl.mouth.y}`;
	d += ` L${dl.nextShore.x},${dl.nextShore.y}`;
	d += ` C${dl.leftCtrl1.x},${dl.leftCtrl1.y} ${dl.leftCtrl2.x},${dl.leftCtrl2.y} ${dl.left.x},${dl.left.y}`;
	return d;
}

function riverRenderGeometry(river) {
	if (!river || !river.course || river.course.length < 2) return null;
	const course = river.delta
		? [{ x: (river.course[0].x + river.course[1].x) / 2, y: (river.course[0].y + river.course[1].y) / 2 }, ...river.course.slice(1)]
		: river.course;
	const visualCourse = chaikinSmooth(course, 3);
	// The dark outline stops at the delta base (visualCourse[0]) so the mouth stays outline-free
	// (water↔water). The blue fill, however, runs one segment further seaward to the actual mouth
	// point, so it overlaps the delta fill — this removes the anti-aliasing hairline crack that
	// otherwise appears where the separate river-fill and water-body-fill paths merely abut.
	const fillCourse = river.delta ? [river.course[0], ...visualCourse] : visualCourse;
	return {
		visualCourse,
		pathD: polyPath(visualCourse),
		fillPathD: polyPath(fillCourse),
		delta: river.delta ? previewDeltaFromPath(river.delta, visualCourse, river.width) : null,
	};
}

function drawWall(wall, riverWidth, riverNodes) {
	if (!wall || !wall.shape || wall.shape.length < 2) return;
	const thickness = 1.6;
	const outlineThickness = thickness + BUILDING_OUTLINE_WIDTH;
	const n = wall.shape.length;
	const segs = wall.segments;
	const halfRiver = (riverWidth || 0) / 2;
	// Records the actual rendered endpoint for each shape vertex (after pull-back), so
	// towers can be placed exactly where the wall lines end instead of re-deriving it.
	const endpointAt = new Map();
	for (let i = 0; i < n; i++) {
		if (segs && segs[i] === false) continue;
		let a = wall.shape[i];
		let b = wall.shape[(i + 1) % n];
		// Pull back an endpoint if the adjacent segment is suppressed OR the endpoint is a
		// river node — the wall extends toward the water but stops at the riverbank.
		if (halfRiver > 0 && segs) {
			const dx = b.x - a.x, dy = b.y - a.y;
			const len = Math.hypot(dx, dy) || 1;
			const ux = dx / len, uy = dy / len;
			let ax = a.x, ay = a.y, bx = b.x, by = b.y;
			if (segs[(i + n - 1) % n] === false || (riverNodes && riverNodes.has(a))) { ax = a.x + ux * halfRiver; ay = a.y + uy * halfRiver; }
			if (segs[(i + 1) % n] === false || (riverNodes && riverNodes.has(b))) { bx = b.x - ux * halfRiver; by = b.y - uy * halfRiver; }
			a = { x: ax, y: ay }; b = { x: bx, y: by };
		}
		// Store the rendered endpoints. For an interior node both adjacent active segments
		// agree on the (un-pulled) vertex; for an "open" end only the single active segment
		// writes, so the tower picks up exactly the pulled-back line end.
		endpointAt.set(i, a);
		endpointAt.set((i + 1) % n, b);
		for (const [stroke, width] of [[PALETTE.wallOutline, outlineThickness], [PALETTE.wall, thickness]]) {
			const seg = document.createElementNS(SVGNS, 'line');
			seg.setAttribute('x1', a.x); seg.setAttribute('y1', a.y);
			seg.setAttribute('x2', b.x); seg.setAttribute('y2', b.y);
			seg.setAttribute('stroke', stroke); seg.setAttribute('stroke-width', width);
			seg.setAttribute('stroke-linecap', 'butt'); seg.setAttribute('stroke-linejoin', 'round');
			vp.appendChild(seg);
		}
	}
	// Place each tower exactly on the wall line end it belongs to. The line-rendering loop
	// above already computed the pulled-back endpoint for every vertex (endpointAt), so the
	// tower centre lands precisely where the line stops instead of being re-derived here.
	const towerR = thickness * WALL_TOWER_DIAMETER_SCALE / 2;
	for (const t of wall.towers || []) {
		const ti = wall.shape.findIndex((p) => Math.abs(p.x - t.x) < 1e-6 && Math.abs(p.y - t.y) < 1e-6);
		const pos = (ti !== -1 && endpointAt.get(ti)) || t;
		const tower = document.createElementNS(SVGNS, 'circle');
		tower.setAttribute('cx', pos.x); tower.setAttribute('cy', pos.y);
		tower.setAttribute('r', towerR); tower.setAttribute('fill', PALETTE.wall);
		tower.setAttribute('stroke', PALETTE.wallOutline); tower.setAttribute('stroke-width', BUILDING_OUTLINE_WIDTH);
		vp.appendChild(tower);
	}
	for (const gate of wall.gates || []) {
		// Skip gates at river nodes — those are bridges with towers, not gates.
		if (riverNodes && riverNodes.has(gate)) continue;
		const idx = wall.shape.findIndex((p) => Math.abs(p.x - gate.x) < 1e-6 && Math.abs(p.y - gate.y) < 1e-6);
		const pos = (idx !== -1 && endpointAt.get(idx)) || gate;
		const tower = document.createElementNS(SVGNS, 'circle');
		tower.setAttribute('cx', pos.x); tower.setAttribute('cy', pos.y);
		tower.setAttribute('r', towerR); tower.setAttribute('fill', PALETTE.gateTower);
		tower.setAttribute('stroke', PALETTE.wallOutline); tower.setAttribute('stroke-width', GATE_TOWER_OUTLINE_WIDTH);
		tower.setAttribute('class', 'gate-tower');
		tower.setAttribute('data-kind', 'gate');
		vp.appendChild(tower);
	}
}

function drawRoads(roads) {
	return;
}

function closestPointOnSegment(p, a, b) {
	const dx = b.x - a.x, dy = b.y - a.y;
	const l2 = dx * dx + dy * dy || 1;
	let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2;
	t = Math.max(0, Math.min(1, t));
	return {
		x: a.x + dx * t,
		y: a.y + dy * t,
		t,
		distance: Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t)),
	};
}

function closestPointOnPath(p, path) {
	let best = null;
	for (let i = 0; i < path.length - 1; i++) {
		const q = closestPointOnSegment(p, path[i], path[i + 1]);
		if (!best || q.distance < best.distance) best = { ...q, segment: i };
	}
	return best;
}

function visualRiverCrossing(origin, axis, path, allowFallback = true) {
	let best = null;
	for (let i = 0; i < path.length - 1; i++) {
		const a = path[i], b = path[i + 1];
		const sx = b.x - a.x, sy = b.y - a.y;
		const denom = axis.x * sy - axis.y * sx;
		if (Math.abs(denom) < 1e-8) continue;
		const ox = a.x - origin.x, oy = a.y - origin.y;
		const t = (ox * sy - oy * sx) / denom;
		const u = (ox * axis.y - oy * axis.x) / denom;
		if (u < -1e-6 || u > 1 + 1e-6) continue;
		const point = { x: origin.x + axis.x * t, y: origin.y + axis.y * t };
		const score = Math.abs(t);
		if (!best || score < best.score) best = { point, segment: i, score };
	}
	if (best) return best;
	if (!allowFallback) return null;

	const closest = closestPointOnPath(origin, path);
	return closest ? { point: { x: closest.x, y: closest.y }, segment: closest.segment, score: closest.distance } : null;
}

function riverTangentAt(path, segment) {
	const a = path[Math.max(0, Math.min(segment, path.length - 2))];
	const b = path[Math.max(1, Math.min(segment + 1, path.length - 1))];
	const dx = b.x - a.x;
	const dy = b.y - a.y;
	const len = Math.hypot(dx, dy) || 1;
	return { x: dx / len, y: dy / len };
}

function bridgeSideShorePoints(origin, axis, path, shoreHalfWidth, referenceNormal = null) {
	const crossing = visualRiverCrossing(origin, axis, path, false);
	if (!crossing) return null;
	const tangent = riverTangentAt(path, crossing.segment);
	let normal = { x: -tangent.y, y: tangent.x };
	if (referenceNormal && normal.x * referenceNormal.x + normal.y * referenceNormal.y < 0)
		normal = { x: -normal.x, y: -normal.y };
	const denom = axis.x * normal.x + axis.y * normal.y;
	if (Math.abs(denom) < 0.12) return null;
	const span = shoreHalfWidth / denom;
	return {
		minus: { x: crossing.point.x - axis.x * span, y: crossing.point.y - axis.y * span },
		plus: { x: crossing.point.x + axis.x * span, y: crossing.point.y + axis.y * span },
		center: crossing.point,
		normal,
	};
}

function bridgeDeckBleedPoint(side, point, bleed) {
	const dx = point.x - side.center.x;
	const dy = point.y - side.center.y;
	const len = Math.hypot(dx, dy);
	if (len < 1e-6) return point;
	return { x: point.x + dx / len * bleed, y: point.y + dy / len * bleed };
}

function drawBridges(river, visualCourse = null) {
	if (!river || !river.bridges || !river.course || river.course.length < 3) return;
	const path = visualCourse && visualCourse.length >= 2 ? visualCourse : river.course;
	const riverWidth = Number.isFinite(river.width) ? river.width : 5;
	const bridgePoint = (bridge) => ({ x: bridge.x, y: bridge.y });
	for (const bridge of river.bridges) {
		const i = river.course.findIndex((p) => Math.abs(p.x - bridge.x) < 1e-6 && Math.abs(p.y - bridge.y) < 1e-6);
		if (i <= 0 || i >= river.course.length - 1) continue;
		const fill = '#e4d7b6';
		// WIDE_MAIN_ROADS_50_FLAG: road-connected bridges carry a serialized 50%-wider deck width.
		const fillWidth = Number.isFinite(bridge.width) ? bridge.width : BRIDGE_FILL_WIDTH;
		const sideOutlineWidth = 0.2;
		let axis = null;
		if (bridge.from && bridge.to) {
			const dx = bridge.to.x - bridge.from.x, dy = bridge.to.y - bridge.from.y;
			const len = Math.hypot(dx, dy) || 1;
			axis = { x: dx / len, y: dy / len };
		} else {
			const crossing = closestPointOnPath(bridgePoint(bridge), path);
			if (!crossing) continue;
			const tangent = riverTangentAt(path, crossing.segment);
			axis = { x: -tangent.y, y: tangent.x };
		}

		const centerCrossing = visualRiverCrossing(bridgePoint(bridge), axis, path);
		if (!centerCrossing) continue;
		const centerTangent = riverTangentAt(path, centerCrossing.segment);
		const referenceNormal = { x: -centerTangent.y, y: centerTangent.x };
		const sideNormal = { x: -axis.y, y: axis.x };
		const halfDeck = fillWidth / 2;
		const shoreHalfWidth = riverWidth / 2 + WATER_OUTLINE_WIDTH;
		const deckBleed = WATER_OUTLINE_WIDTH * 1.5 + 0.05;
		const leftOrigin = {
			x: centerCrossing.point.x + sideNormal.x * halfDeck,
			y: centerCrossing.point.y + sideNormal.y * halfDeck,
		};
		const rightOrigin = {
			x: centerCrossing.point.x - sideNormal.x * halfDeck,
			y: centerCrossing.point.y - sideNormal.y * halfDeck,
		};
		const left = bridgeSideShorePoints(leftOrigin, axis, path, shoreHalfWidth, referenceNormal);
		const right = bridgeSideShorePoints(rightOrigin, axis, path, shoreHalfWidth, referenceNormal);
		if (!left || !right) continue;

		const deck = document.createElementNS(SVGNS, 'polygon');
		const deckPts = [
			bridgeDeckBleedPoint(left, left.minus, deckBleed),
			bridgeDeckBleedPoint(left, left.plus, deckBleed),
			bridgeDeckBleedPoint(right, right.plus, deckBleed),
			bridgeDeckBleedPoint(right, right.minus, deckBleed),
		];
		deck.setAttribute('points', deckPts.map((p) => `${p.x},${p.y}`).join(' '));
		deck.setAttribute('fill', fill);
		deck.setAttribute('stroke', 'none');
		vp.appendChild(deck);
		for (const side of [left, right]) {
			const rail = document.createElementNS(SVGNS, 'line');
			rail.setAttribute('x1', side.minus.x); rail.setAttribute('y1', side.minus.y);
			rail.setAttribute('x2', side.plus.x); rail.setAttribute('y2', side.plus.y);
			rail.setAttribute('stroke', PALETTE.bridgeDockOutline);
			rail.setAttribute('stroke-width', sideOutlineWidth);
			rail.setAttribute('stroke-linecap', 'butt');
			vp.appendChild(rail);
		}
	}
}

function drawDocks(docks) {
	if (!docks || docks.length === 0) return;
	for (const dock of docks) {
		const w = dock.large ? 2 : 1;
		// Revert dock fill to its original width; outline is a thin black rim on the sides
		// plus a flat cap at the sea end.
		const fillWidth = 1.6 * w;
		const outlineWidth = fillWidth + 0.4 * w; // 0.2 rim on each side
		const fill = '#e4d7b6';
		for (const pier of dock.piers || []) {
			if (!pier.from || !pier.to) continue;
			const dx = pier.to.x - pier.from.x;
			const dy = pier.to.y - pier.from.y;
			const len = Math.hypot(dx, dy) || 1;
			const ux = dx / len;
			const uy = dy / len;
			// Extend the black outline slightly past the sea-side end so it forms a flat end cap.
			const seaCap = { x: pier.to.x + ux * outlineWidth / 10, y: pier.to.y + uy * outlineWidth / 10 };

			// shore outline stroke pokes out between the pier and the land, visually "cutting off" the
			// dock. Run the fill (only) a touch inland — it shares the city-ward colour, so it merges
			// seamlessly into the land while covering that outline. The black side-rims still stop at
			// the shore, so no new outline appears on land.
			const landOverlap = WATER_OUTLINE_WIDTH * 2;
			const landFrom = { x: pier.from.x - ux * landOverlap, y: pier.from.y - uy * landOverlap };
			const dFill = `M${landFrom.x},${landFrom.y} L${pier.to.x},${pier.to.y}`;
			const dOutline = `M${pier.from.x},${pier.from.y} L${seaCap.x},${seaCap.y}`;
			for (const [stroke, width, d] of [[PALETTE.bridgeDockOutline, outlineWidth, dOutline], [fill, fillWidth, dFill]]) {

				path.setAttribute('d', d); path.setAttribute('fill', 'none');
				path.setAttribute('stroke', stroke); path.setAttribute('stroke-width', width);
				path.setAttribute('stroke-linecap', 'butt'); path.setAttribute('stroke-linejoin', 'round');
				vp.appendChild(path);

}

// Fillet radius for the block outline corners equals the building-lot shrink distance.
// Alley gap defaults to 0.8, so gap/2 = 0.4.
const BLOCK_OUTLINE_FILLET = 0.4;

function roundedBlockPath(points, r) {
	if (!points || points.length < 3) return null;
	const n = points.length;
	const leftNormal = (dx, dy, len) => (len > 0 ? { x: -dy / len, y: dx / len } : null);

	const segs = [];
	for (let i = 0; i < n; i++) {
		const A = points[(i - 1 + n) % n];
		const B = points[i];
		const C = points[(i + 1) % n];

		const inDx = B.x - A.x, inDy = B.y - A.y;
		const outDx = C.x - B.x, outDy = C.y - B.y;
		const inLen = Math.hypot(inDx, inDy);
		const outLen = Math.hypot(outDx, outDy);
		if (inLen < 1e-9 || outLen < 1e-9) return null;

		const inUx = inDx / inLen, inUy = inDy / inLen;
		const outUx = outDx / outLen, outUy = outDy / outLen;
		const dot = inUx * outUx + inUy * outUy;
		const turn = Math.acos(Math.max(-1, Math.min(1, dot)));
		if (turn < 1e-6) return null;

		// Interior bisector for a CCW polygon is the sum of the edge left-normals.
		const lnIn = leftNormal(inDx, inDy, inLen);
		const lnOut = leftNormal(outDx, outDy, outLen);
		const bisX = lnIn.x + lnOut.x;
		const bisY = lnIn.y + lnOut.y;
		const bisLen = Math.hypot(bisX, bisY);
		if (bisLen < 1e-9) return null;
		const nBisX = bisX / bisLen;
		const nBisY = bisY / bisLen;

		const halfTurn = turn / 2;
		const tanHalf = Math.tan(halfTurn);
		const cosHalf = Math.cos(halfTurn);
		if (tanHalf < 1e-9 || cosHalf < 1e-9) return null;

		// Clamp tangent distance so the fillet never overruns an edge.
		let d = r * tanHalf;
		d = Math.min(d, inLen * 0.499, outLen * 0.499);
		const effR = d / tanHalf;
		const centerDist = effR / cosHalf;

		const t1x = B.x - inUx * d;
		const t1y = B.y - inUy * d;
		const t2x = B.x + outUx * d;
		const t2y = B.y + outUy * d;
		const cx = B.x + nBisX * centerDist;
		const cy = B.y + nBisY * centerDist;

		const a1 = Math.atan2(t1y - cy, t1x - cx);
		const a2 = Math.atan2(t2y - cy, t2x - cx);
		let delta = a2 - a1;
		while (delta > Math.PI) delta -= 2 * Math.PI;
		while (delta < -Math.PI) delta += 2 * Math.PI;
		const sweep = delta > 0 ? 1 : 0;
		const largeArc = Math.abs(delta) > Math.PI ? 1 : 0;

		segs.push({ t1x, t1y, t2x, t2y, cx, cy, r: effR, sweep, largeArc });
	}

	let d = `M${segs[0].t2x},${segs[0].t2y}`;
	for (let i = 0; i < n; i++) {
		const next = segs[(i + 1) % n];
		d += ` L${next.t1x},${next.t1y}`;
		d += ` A${next.r},${next.r} 0 ${next.largeArc},${next.sweep} ${next.t2x},${next.t2y}`;
	}
	return d + 'Z';
}

function drawBlocks(blocks) {
	if (!blocks || blocks.length === 0) return;
	let d = '';
	for (const b of blocks) {
		if (!b || b.length < 3) continue;

	if (!d) return;
	const el = document.createElementNS(SVGNS, 'path');
	el.setAttribute('d', d);
	el.setAttribute('fill', 'none');
	el.setAttribute('stroke', PALETTE.block);

// Visual-debug overlay of impassable shapes (water, river strip, buildings,

function drawObstacles(d) {

function render(d) {

	for (const w of d.wards) {

		if (!w.polygon || w.polygon.length < 3) continue;
		const el = document.createElementNS(SVGNS, 'polygon');
		el.setAttribute('points', w.polygon.map((p) => p.x + ',' + p.y).join(' '));

		vp.appendChild(el);
	}
	const riverGeometry = riverRenderGeometry(d.river);
	drawBlocks(d.blocks);
	drawBuildings(d.buildings);
	drawHedges(d.hedges);
	drawCathedralHedges(d.cathedralHedges);
	drawRoads(d.roads);
	drawWaterBody(d.wards, d.river, riverGeometry, d.bounds);

		for (const w of d.wards) {

	const dockPierCount = (d.docks || []).reduce((sum, dock) => sum + (dock.piers ? dock.piers.length : 0), 0);
	const gateText = d.wall && d.wall.gates ? ` · ${d.wall.gates.length} gates` : '';

	const dockText = dockPierCount > 0 ? ` · ${dockPierCount} dock piers` : '';
	const bridgeCount = d.river && d.river.bridges ? d.river.bridges.length : 0;
	const bridgeText = bridgeCount > 0 ? ` · ${bridgeCount} bridges` : '';

	const blockText = blockCount > 0 ? ` · ${blockCount} blocks` : '';
	statusEl.textContent = `seed ${d.seed} · size ${d.size} · ${d.wards.length} wards (${innerCount} city, ${outerCount} outer, ${waterCount} water)${gateText} · ${roadCount} arteries${bridgeText}${dockText}${blockText}`;
}

function generate() {
	const startTime = performance.now();
	const params = {
		seed: parseInt($('seed').value, 10) || 1,
		size: parseInt($('size').value, 10),
		plaza: $('plaza').checked,
		coast: $('coast').checked,
		river: $('river').checked,
		walls: $('walls').checked,
		streets: $('streets').checked,
		outerRatio: parseFloat($('outerratio').value) || 8,
		roadDensity: parseFloat($('roaddens').value) || 0,
		gates: parseInt($('gates').value, 10),
	};
	const t0 = performance.now();
	try {
		data = generateWards(params);
		render(data);
		statusEl.textContent += ` · ${(performance.now() - t0).toFixed(0)}ms`;
	} catch (e) { statusEl.textContent = 'error: ' + e.message; }

	// Build the visibility graph scaffolding from the obstacle map (separate
	// timer from the ward-generation timer above). Edges are computed lazily
	// at query time, so this measures ONLY the upfront scaffolding cost (node
	// flattening + spatial indices + LOS oracle).
	const vgStart = performance.now();
	try {
		const obstacles = extractObstacles(data);
		visibilityGraph = buildVisibilityGraph(obstacles, ROUTE_VISIBILITY_GRAPH_OPTIONS);
		console.log(`Visibility graph scaffolding built in ${(performance.now() - vgStart).toFixed(1)} ms · ${visibilityGraph.nodeCount} nodes · ${visibilityGraph.blockerCount} blocker edges · edges computed lazily (${visibilityGraph.neighborRing}-cell ring)`);
	} catch (e) {
		visibilityGraph = null;
		console.error('Visibility graph build failed:', e);
	}
	const endTime = performance.now();
	console.log(`Generation took ${endTime - startTime} milliseconds`);
}

				const px = -(path[i].y - path[i-1].y) / norm;
				const py = (path[i].x - path[i-1].x) / norm;
				const distFromPrev = targetLen - accum;
				const distToNext = accum + segLen - targetLen;
				let leftDist = MAX_HALF, rightDist = MAX_HALF;
				let leftHit = false, rightHit = false;
				for (let d = STEP; d <= MAX_HALF; d += STEP) {
					if (routePointInSignificantRawObstacle(mx + px * d, my + py * d, visGraph)) { leftDist = d; leftHit = true; break; }
				}
				for (let d = STEP; d <= MAX_HALF; d += STEP) {
					if (routePointInSignificantRawObstacle(mx - px * d, my - py * d, visGraph)) { rightDist = d; rightHit = true; break; }
				}
				return { frac, mx, my, px, py, leftDist, rightDist, leftHit, rightHit, distFromPrev, distToNext };
			}
			accum += segLen;
		}
		return null;
	};
	// Build the wall segment spanning the corridor at probe point `p`, extended by
	// MARGIN past each wall so it seats firmly into the flanking obstacles.
	const wallAt = (p) => ({
		mx: p.mx, my: p.my,
		ax: p.mx + p.px * (p.leftDist + MARGIN), ay: p.my + p.py * (p.leftDist + MARGIN),
		bx: p.mx - p.px * (p.rightDist + MARGIN), by: p.my - p.py * (p.rightDist + MARGIN),
		len: p.leftDist + p.rightDist + MARGIN * 2,
	});
	const isClearOfRouteNodes = (p) =>
		Math.min(p.distFromPrev, p.distToNext) >= ROUTE_BARRIER_DRAW_WIDTH;

	// Preferred placement: slide within +/-5% of the route midpoint and choose the
	// shortest enclosed alley bar that is not sitting on a bracketing route vertex.
	// Narrowest-anywhere is kept only as a fallback for open maps that have no
	// enclosed corridor in the midpoint window.
	let bestClearEnclosed = null, bestClearScore = Infinity;
	let bestEnclosed = null, bestEnclosedScore = Infinity;
	let bestFallback = null, bestFallbackScore = Infinity;
	const minFrac = Math.max(0, CENTER_FRACTION - ROUTE_BARRIER_SLIDE_FRACTION);
	const maxFrac = Math.min(1, CENTER_FRACTION + ROUTE_BARRIER_SLIDE_FRACTION);
	for (let s = 0; s <= SLIDE_SAMPLES; s++) {
		const frac = minFrac + (maxFrac - minFrac) * (s / SLIDE_SAMPLES);
		const p = probe(frac);
		if (!p) continue;
		const width = p.leftDist + p.rightDist;
		const centerPenalty = Math.abs(frac - CENTER_FRACTION) * 1e-3;
		if (p.leftHit && p.rightHit) {
			const score = width + centerPenalty;
			if (isClearOfRouteNodes(p) && score < bestClearScore) {
				bestClearScore = score;
				bestClearEnclosed = wallAt(p);
			}
			if (score < bestEnclosedScore) {
				bestEnclosedScore = score;
				bestEnclosed = wallAt(p);
			}
		}
		if (width + centerPenalty < bestFallbackScore) {
			bestFallbackScore = width + centerPenalty;
			bestFallback = wallAt(p);
		}
	}
	if (bestClearEnclosed || bestEnclosed) return bestClearEnclosed || bestEnclosed;

	let broadEnclosed = null, broadEnclosedScore = Infinity;
	let broadFallback = null, broadFallbackScore = Infinity;
	for (let s = 0; s <= FALLBACK_SAMPLES; s++) {
		const frac = 0.25 + 0.5 * (s / FALLBACK_SAMPLES);
		const p = probe(frac);
		if (!p) continue;
		const width = p.leftDist + p.rightDist;
		if (p.leftHit && p.rightHit) {
			const score = Math.abs(frac - CENTER_FRACTION);
			if (score < broadEnclosedScore) { broadEnclosedScore = score; broadEnclosed = wallAt(p); }
		}
		if (width < broadFallbackScore) { broadFallbackScore = width; broadFallback = wallAt(p); }
	}
	return broadEnclosed || bestFallback || broadFallback;
}

// EXPERIMENTAL EXACT ROUTING: set false to return route clicks/stress tests to
// the previous faster local-neighbour visibility graph.
const ROUTE_USE_EXACT_VISIBILITY = false;
const ROUTE_ASTAR_OPTIONS = ROUTE_USE_EXACT_VISIBILITY ? { exact: true } : {};
const ROUTE_EXTRA_ASTAR_OPTIONS = { ...ROUTE_ASTAR_OPTIONS, timeBudgetMs: 200 };
const ROUTE_MANUAL_ASTAR_OPTIONS = ROUTE_USE_EXACT_VISIBILITY
	? { exact: true, timeBudgetMs: 0, maxExpansions: 1000000 }
	: {};
const ROUTE_STRESS_ALTERNATE_ATTEMPTS = 4;
const ROUTE_MANUAL_ALTERNATE_ATTEMPTS = 3;

const emptyRouteSlots = () => [null, null, null, null];
function routePathSignature(path) {
	return path.map((p) => `${Math.round(p.x * 1000)},${Math.round(p.y * 1000)}`).join('|');
}

function computeRouteOptions(startPt, goalPt, visGraph) {
	const t0 = performance.now();
	if (!visGraph) return { ok: false, reason: 'side', paths: [], selected: null, routeLengthSlots: emptyRouteSlots(), routeSideSlots: emptyRouteSlots(), routeSideLabelSlots: emptyRouteSlots(), routeIndexes: [], blockFastest: false, barriers: [], skippedBarriers: [], dt: 0, timeout: false };
	visGraph.clearTempBlockers();

	let paths = [];
	const barriers = [];
	// True if ANY of this pair's A* attempts bailed on the time budget. Lets the
	// stress log tell a genuine geometric reject ('side'/'distinct'/'distance')
	// apart from one caused by A* timing out on a hard cross-river detour.
	let timeout = false;

	for (let attempt = 0; attempt < ROUTE_STRESS_ALTERNATE_ATTEMPTS; attempt++) {
		const astarOptions = attempt >= 2 ? ROUTE_EXTRA_ASTAR_OPTIONS : ROUTE_ASTAR_OPTIONS;
		const result = visGraph.astar(startPt, goalPt, astarOptions);
		if (visGraph.lastAstarTimedOut) timeout = true;
		if (!result || result.path.length < 2) break;
		const path = result.path;
		const len = routePathLength(path);
		const pathRecord = { path, len, routeIndex: attempt + 1, attemptIndex: attempt + 1, barrier: null };
		paths.push(pathRecord);
		if (attempt >= ROUTE_STRESS_ALTERNATE_ATTEMPTS - 1) break;
		const barrier = findSmartBarrier(path, visGraph);
		if (!barrier) break;
		if (barrier) {
			barrier.attemptIndex = attempt + 1;
			pathRecord.barrier = barrier;
			barriers.push(barrier);
			visGraph.addTempBlocker(barrier.ax, barrier.ay, barrier.bx, barrier.by);
		}
	}

	visGraph.clearTempBlockers();
	const dt = performance.now() - t0;

	if (paths.length === 0) {
		return { ok: false, reason: 'timeout', paths, selected: null, routeLengthSlots: emptyRouteSlots(), routeSideSlots: emptyRouteSlots(), routeSideLabelSlots: emptyRouteSlots(), routeIndexes: [], blockFastest: false, barriers, skippedBarriers: [], dt, timeout: true };
	}
	if (paths.length === 1) {
		const routeLengthSlots = emptyRouteSlots();
		routeLengthSlots[0] = paths[0].len;
		return { ok: false, reason: timeout ? 'timeout' : 'distinct', paths, selected: null, routeLengthSlots, routeSideSlots: emptyRouteSlots(), routeSideLabelSlots: emptyRouteSlots(), routeIndexes: [1], blockFastest: false, barriers, skippedBarriers: [], dt, timeout };
	}

	paths.sort((a, b) => a.len - b.len);
	for (let i = 0; i < paths.length; i++) paths[i].routeIndex = i + 1;

	const sgDx = goalPt.x - startPt.x, sgDy = goalPt.y - startPt.y;
	const sgLen = Math.hypot(sgDx, sgDy) || 1;
	for (const p of paths) {
		let sum = 0;
		for (const pt of p.path) sum += sgDx * (pt.y - startPt.y) - sgDy * (pt.x - startPt.x);
		p.side = (sum / p.path.length) / sgLen;
		p.sideLabel = p.side > 0 ? 'R' : p.side < 0 ? 'L' : 'C';
	}

	const seenPathSignatures = new Set();
	paths = paths.filter((p) => {
		const sig = routePathSignature(p.path);
		if (seenPathSignatures.has(sig)) return false;
		seenPathSignatures.add(sig);
		return true;
	});
	for (let i = 0; i < paths.length; i++) paths[i].routeIndex = i + 1;
	if (paths.length < 2) {
		const routeLengthSlots = emptyRouteSlots();
		const routeSideSlots = emptyRouteSlots();
		const routeSideLabelSlots = emptyRouteSlots();
		for (const p of paths) {
			routeLengthSlots[p.routeIndex - 1] = p.len;
			routeSideSlots[p.routeIndex - 1] = p.side;
			routeSideLabelSlots[p.routeIndex - 1] = p.sideLabel;
		}
		return { ok: false, reason: 'distinct', paths, selected: null, routeLengthSlots, routeSideSlots, routeSideLabelSlots, routeIndexes: [], blockFastest: false, barriers, skippedBarriers: [], dt, timeout };
	}

	const pairs = [];
	for (let i = 0; i < paths.length; i++) {
		for (let j = i + 1; j < paths.length; j++) {
			const sideGap = Math.abs(paths[i].side - paths[j].side);
			const shorter = paths[i].len;
			const longer = paths[j].len;
			pairs.push({ i, j, relativeGap: shorter > 0 ? (longer - shorter) / shorter : Infinity, total: shorter + longer, sideGap });
		}
	}
	pairs.sort((a, b) => a.relativeGap - b.relativeGap || a.total - b.total);
	const bestPair = pairs[0];
	const selected = [paths[bestPair.i], paths[bestPair.j]];

	if (bestPair.relativeGap > 0.5) {
		const routeLengthSlots = emptyRouteSlots();
		const routeSideSlots = emptyRouteSlots();
		const routeSideLabelSlots = emptyRouteSlots();
		for (const p of paths) {
			routeLengthSlots[p.routeIndex - 1] = p.len;
			routeSideSlots[p.routeIndex - 1] = p.side;
			routeSideLabelSlots[p.routeIndex - 1] = p.sideLabel;
		}
		return { ok: false, reason: 'distance', paths, selected: null, routeLengthSlots, routeSideSlots, routeSideLabelSlots, routeIndexes: [], blockFastest: false, barriers, skippedBarriers: [], dt, timeout };
	}

	if (bestPair.sideGap < ROUTE_STRESS_MIN_SIDE_GAP || selected[0].side * selected[1].side >= 0) {
		const routeLengthSlots = emptyRouteSlots();
		const routeSideSlots = emptyRouteSlots();
		const routeSideLabelSlots = emptyRouteSlots();
		for (const p of paths) {
			routeLengthSlots[p.routeIndex - 1] = p.len;
			routeSideSlots[p.routeIndex - 1] = p.side;
			routeSideLabelSlots[p.routeIndex - 1] = p.sideLabel;
		}
		return { ok: false, reason: 'side', paths, selected: null, routeLengthSlots, routeSideSlots, routeSideLabelSlots, routeIndexes: [], blockFastest: false, barriers, skippedBarriers: [], dt, timeout };
	}

	const selectedShortest = Math.min(selected[0].len, selected[1].len);
	const skippedBarriers = paths
		.filter((p) => p.len < selectedShortest && p.barrier)
		.map((p) => p.barrier);
	const blockFastest = skippedBarriers.length > 0;

	const routeLengthSlots = emptyRouteSlots();
	const routeSideSlots = emptyRouteSlots();
	const routeSideLabelSlots = emptyRouteSlots();
	for (const p of selected) routeLengthSlots[p.routeIndex - 1] = p.len;
	for (const p of paths) {
		routeSideSlots[p.routeIndex - 1] = p.side;
		routeSideLabelSlots[p.routeIndex - 1] = p.sideLabel;
	}
	return {
		ok: true,
		reason: 'ok',
		paths,
		selected,
		routeLengthSlots,
		routeSideSlots,
		routeSideLabelSlots,
		routeIndexes: selected.map(p => p.routeIndex),
		blockFastest,
		barriers,
		skippedBarriers,
		dt,
		timeout,
	};
}
function drawComputedRoute(g, result) {
	const MARK = '#d12b2b';
	drawEndpointMarkers(g, MARK);
	if (!result || !result.ok) {
		if (result && result.paths && result.paths.length === 1) drawPathLine(g, result.paths[0].path, '#d12b2b');
		return;
	}
	const COLORS = ['#d12b2b', '#2b7bd1'];
	result.selected.forEach((p, i) => drawPathLine(g, p.path, COLORS[i]));

	const blockedBars = (result.skippedBarriers && result.skippedBarriers.length)
		? result.skippedBarriers
		: (result.blockFastest && result.barriers.length > 0 ? [result.barriers[0]] : []);
	for (const b of blockedBars) {
		const line = document.createElementNS(SVGNS, 'line');
		line.setAttribute('x1', b.ax); line.setAttribute('y1', b.ay);
		line.setAttribute('x2', b.bx); line.setAttribute('y2', b.by);
		line.setAttribute('stroke', '#a033f0');
		line.setAttribute('stroke-width', ROUTE_BARRIER_DRAW_WIDTH);
		line.setAttribute('stroke-linecap', 'butt');
		g.appendChild(line);
	}
}

function drawManualSingleRoute(g, startPt, goalPt, visGraph) {
	drawEndpointMarkers(g, '#d12b2b');
	if (!visGraph) return;
	if (visGraph.clearTempBlockers) visGraph.clearTempBlockers();
	const t0 = performance.now();
	const candidates = [];
	const barriers = [];
	for (let attempt = 0; attempt < ROUTE_MANUAL_ALTERNATE_ATTEMPTS; attempt++) {
		const candidate = visGraph.astar(startPt, goalPt, ROUTE_MANUAL_ASTAR_OPTIONS);
		if (!candidate || !candidate.path || candidate.path.length < 2) break;
		candidates.push({
			result: candidate,
			len: routePathLength(candidate.path),
		});
		const barrier = findSmartBarrier(candidate.path, visGraph);
		if (!barrier) break;
		barriers.push(barrier);
		visGraph.addTempBlocker(barrier.ax, barrier.ay, barrier.bx, barrier.by);
	}
	if (visGraph.clearTempBlockers) visGraph.clearTempBlockers();
	const dt = performance.now() - t0;
	candidates.sort((a, b) => a.len - b.len);
	const result = candidates.length ? candidates[0].result : null;
	if (!result || !result.path || result.path.length < 2) {
		console.log(`route: no path found · ${dt.toFixed(2)}ms`);
		return;
	}
	drawPathLine(g, result.path, '#d12b2b');
	const len = routePathLength(result.path);
	const altText = candidates.length > 1 ? ` · best of ${candidates.length}` : '';
	console.log(`route: single path · ${result.path.length} hops · len=${len.toFixed(2)} · ${result.iterations} iters${altText} · ${dt.toFixed(2)}ms`);
}

const ROUTE_STRESS_DEFAULTS = {
	size: 30,
	plaza: true,
	coast: true,
	river: true,
	walls: true,
	streets: true,
	outerRatio: 4,
	roadDensity: 5,
	gates: -1,
};
function routeTestRandomSettings(seed) {

		...ROUTE_STRESS_DEFAULTS,
		seed,
		size: 25 + Math.floor(Math.random() * 16),
		river: Math.random() >= 0.5,
		coast: Math.random() >= 0.5,
		walls: Math.random() >= 0.25,
	};
}
const ROUTE_STRESS_MAX_RUNS = 1000;
const ROUTE_STRESS_MIN_DIST = 40;
const ROUTE_STRESS_MAX_DIST = 120;
const ROUTE_STRESS_MIN_SIDE_GAP = 10; // min average side-position gap in map units for a route pair
const ROUTE_STRESS_ROUTE_ATTEMPT_PAUSE = 20;
const ROUTE_STRESS_EXPORT_EVERY = 100;
const ROUTE_STRESS_OUTSIDE_WALL_MAX_DIST = 12;
const ROUTE_STRESS_POINT_POOL_SIZE = 64;
const ROUTE_STRESS_INTERIOR_BIAS_POWER = 3;
const ROUTE_STRESS_INTERIOR_BIAS_CAP = 12;
const ROUTE_STRESS_INTERIOR_BIAS_EPS = 0.25;
let routeStressRunning = false;
let routeStressAbort = false;
let routeStressLog = [];
let routeStressScreenshots = [];
window.routeStressLog = routeStressLog;
window.routeStressScreenshots = routeStressScreenshots;

function routeTestPointInPolygon(pt, poly) {
	let inside = false;
	for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
		const a = poly[i], b = poly[j];
		if ((a.y > pt.y) !== (b.y > pt.y)) {
			const x = (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x;
			if (pt.x < x) inside = !inside;
		}
	}
	return inside;
}

function routeTestWardBbox(ward) {
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	for (const p of ward.polygon) {
		if (p.x < minX) minX = p.x;
		if (p.y < minY) minY = p.y;
		if (p.x > maxX) maxX = p.x;
		if (p.y > maxY) maxY = p.y;
	}
	return { minX, minY, maxX, maxY };
}

function routeTestPointSegmentDistance(pt, a, b) {
	const dx = b.x - a.x, dy = b.y - a.y;
	const len2 = dx * dx + dy * dy;
	if (len2 <= 1e-9) return Math.hypot(pt.x - a.x, pt.y - a.y);
	const t = Math.max(0, Math.min(1, ((pt.x - a.x) * dx + (pt.y - a.y) * dy) / len2));
	return Math.hypot(pt.x - (a.x + dx * t), pt.y - (a.y + dy * t));
}

function routeTestDistanceToClosedPolyline(pt, pts) {
	let best = Infinity;
	for (let i = 0; i < pts.length; i++) {
		const a = pts[i], b = pts[(i + 1) % pts.length];
		best = Math.min(best, routeTestPointSegmentDistance(pt, a, b));
	}
	return best;
}

function routeTestPointAllowedForStress(pt, ward, wall) {
	if (ward.inner) return 'inner';
	const wallShape = wall && wall.shape;
	if (!wallShape || wallShape.length < 3) return null;
	if (routeTestPointInPolygon(pt, wallShape)) return null;
	if (routeTestDistanceToClosedPolyline(pt, wallShape) <= ROUTE_STRESS_OUTSIDE_WALL_MAX_DIST) return 'outsideWall';
	return null;
}

function routeTestPickWeightedPoint(pool) {
	let total = 0;
	for (const p of pool) total += p.weight;
	let r = Math.random() * total;
	for (const p of pool) {
		r -= p.weight;
		if (r <= 0) return p;
	}
	return pool[pool.length - 1] || null;
}

function routeTestPickPoint(candidates, visGraph, wall = null) {
	const pool = [];
	for (let attempt = 0; attempt < 500; attempt++) {
		const item = candidates[(Math.random() * candidates.length) | 0];
		const b = item.bbox;
		for (let local = 0; local < 20; local++) {
			const pt = {
				x: b.minX + Math.random() * (b.maxX - b.minX),
				y: b.minY + Math.random() * (b.maxY - b.minY),
			};
			if (!routeTestPointInPolygon(pt, item.ward.polygon)) continue;
			const area = routeTestPointAllowedForStress(pt, item.ward, wall);
			if (!area) continue;
			if (visGraph._inRawObstacle && visGraph._inRawObstacle(pt.x, pt.y)) continue;
			const boundaryDist = routeTestDistanceToClosedPolyline(pt, item.ward.polygon);
			const biasedDist = Math.min(boundaryDist, ROUTE_STRESS_INTERIOR_BIAS_CAP) + ROUTE_STRESS_INTERIOR_BIAS_EPS;
			pool.push({
				...pt,
				wardType: item.ward.type || 'generic',
				area,
				boundaryDist,
				weight: Math.pow(biasedDist, ROUTE_STRESS_INTERIOR_BIAS_POWER),
			});
			if (pool.length >= ROUTE_STRESS_POINT_POOL_SIZE) {
				const picked = routeTestPickWeightedPoint(pool);
				if (!picked) return null;
				const { weight, ...out } = picked;
				return out;
			}
		}
	}
	const picked = routeTestPickWeightedPoint(pool);
	if (!picked) return null;
	const { weight, ...out } = picked;
	return out;
}

function routeTestPickPair(candidates, visGraph, wall = null, rejectionCounts = null) {
	for (let attempt = 0; attempt < 1000; attempt++) {
		const start = routeTestPickPoint(candidates, visGraph, wall);
		const goal = routeTestPickPoint(candidates, visGraph, wall);
		if (!start || !goal) return null;
		const straightLine = Math.hypot(goal.x - start.x, goal.y - start.y);
		if (straightLine >= ROUTE_STRESS_MIN_DIST && straightLine <= ROUTE_STRESS_MAX_DIST)
			return { start, goal, straightLine };
		// Note: per-attempt distance rejections are NOT counted here. One rejection is
		// counted per outer retry in runRouteStressTest so retries == sum of rejectX.
	}
	return null;
}

function routeTestCsvValue(v) {

}

function routeTestRecordsToCsv(records) {
	const columns = [
		'run', 'seed', 'status', 'screenshotIndex', 'screenshotFile',
		'size', 'river', 'shore', 'walls',
		'retries', 'rejectDistinct', 'rejectDistance', 'rejectSide', 'timeout',
		'cityGenerationMs', 'navMeshGenerationMs', 'pathfindingUntilFoundMs', 'pathfindingMsByRetry',
		'startX', 'startY', 'startWardType', 'startArea', 'goalX', 'goalY', 'goalWardType', 'goalArea', 'straightLineDistance',
		'selectedRouteIndexes', 'route1Length', 'route2Length', 'route3Length', 'route4Length',
		'route1Side', 'route2Side', 'route3Side', 'route4Side', 'route1SideLabel', 'route2SideLabel', 'route3SideLabel', 'route4SideLabel',
		'candidateRouteLengths', 'reason', 'failedAttempts',
	];
	const rows = [columns.join(',')];
	for (const r of records) {
		rows.push(columns.map((col) => routeTestCsvValue(r[col])).join(','));
	}
	return rows.join('\n') + '\n';

function routeTestDownloadLog() {
	if (!routeStressLog.length) {
		console.warn('route-stress: no log records to save');
		return;
	}
	const text = routeTestRecordsToCsv(routeStressLog);
	const blob = new Blob([text], { type: 'text/csv' });
	const url = URL.createObjectURL(blob);
	const a = document.createElement('a');
	const stamp = new Date().toISOString().replace(/[:.]/g, '-');
	a.href = url;
	a.download = `route-stress-${stamp}.csv`;
	document.body.appendChild(a);
	a.click();
	a.remove();
	URL.revokeObjectURL(url);
}

function routeTestRouteBounds(pair, routeResult, pad = 8) {
	const pts = [];
	if (pair) pts.push(pair.start, pair.goal);
	if (routeResult && routeResult.selected) {
		for (const r of routeResult.selected)
			for (const p of r.path) pts.push(p);
	}
	if (pts.length === 0) return null;
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	for (const p of pts) {
		if (p.x < minX) minX = p.x;
		if (p.y < minY) minY = p.y;
		if (p.x > maxX) maxX = p.x;
		if (p.y > maxY) maxY = p.y;
	}
	return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
}

function routeTestStandaloneSvg(crop) {
	const width = Math.max(1, crop.maxX - crop.minX);
	const height = Math.max(1, crop.maxY - crop.minY);
	const clone = vp.cloneNode(true);
	clone.removeAttribute('transform');
	clone.setAttribute('transform', `translate(${-crop.minX},${-crop.minY})`);
	const body = new XMLSerializer().serializeToString(clone);
	return `<svg xmlns="${SVGNS}" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="#efe9d8"/>${body}</svg>`;
}

async function routeTestCaptureScreenshot(index, pair, routeResult) {
	const crop = routeTestRouteBounds(pair, routeResult);
	if (!crop) return null;
	const svgText = routeTestStandaloneSvg(crop);
	const cropWidth = crop.maxX - crop.minX;
	const cropHeight = crop.maxY - crop.minY;
	const maxPixels = 550;
	const scaleFactor = Math.min(maxPixels / Math.max(cropWidth, cropHeight), 5);
	const canvasWidth = Math.max(1, Math.round(cropWidth * scaleFactor));
	const canvasHeight = Math.max(1, Math.round(cropHeight * scaleFactor));
	const svgBlob = new Blob([svgText], { type: 'image/svg+xml' });
	const url = URL.createObjectURL(svgBlob);
	try {
		const img = new Image();
		await new Promise((resolve, reject) => {
			img.onload = resolve;
			img.onerror = reject;
			img.src = url;
		});
		const canvas = document.createElement('canvas');
		canvas.width = canvasWidth;
		canvas.height = canvasHeight;
		const ctx = canvas.getContext('2d');
		ctx.drawImage(img, 0, 0, canvasWidth, canvasHeight);
		const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
		if (!blob) return null;
		const filename = `route-stress-${String(index).padStart(4, '0')}.png`;
		const shot = { index, filename, blob, crop };
		routeStressScreenshots.push(shot);
		window.routeStressScreenshots = routeStressScreenshots;
		return shot;
	} finally {
		URL.revokeObjectURL(url);
	}
}

function routeTestCrc32(bytes) {
	let c = -1;
	for (let i = 0; i < bytes.length; i++) {
		c ^= bytes[i];
		for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
	}
	return (c ^ -1) >>> 0;
}

function routeTestU16(out, v) { out.push(v & 255, (v >>> 8) & 255); }
function routeTestU32(out, v) { out.push(v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255); }

async function routeTestCreateZip(files) {
	const encoder = new TextEncoder();
	const chunks = [];
	const central = [];
	let offset = 0;
	for (const file of files) {
		const nameBytes = encoder.encode(file.name);
		const bytes = new Uint8Array(await file.blob.arrayBuffer());
		const crc = routeTestCrc32(bytes);
		const local = [];
		routeTestU32(local, 0x04034b50);
		routeTestU16(local, 20); routeTestU16(local, 0); routeTestU16(local, 0);
		routeTestU16(local, 0); routeTestU16(local, 0);
		routeTestU32(local, crc); routeTestU32(local, bytes.length); routeTestU32(local, bytes.length);
		routeTestU16(local, nameBytes.length); routeTestU16(local, 0);
		chunks.push(new Uint8Array(local), nameBytes, bytes);

		const cd = [];
		routeTestU32(cd, 0x02014b50);
		routeTestU16(cd, 20); routeTestU16(cd, 20); routeTestU16(cd, 0); routeTestU16(cd, 0);
		routeTestU16(cd, 0); routeTestU16(cd, 0);
		routeTestU32(cd, crc); routeTestU32(cd, bytes.length); routeTestU32(cd, bytes.length);
		routeTestU16(cd, nameBytes.length); routeTestU16(cd, 0); routeTestU16(cd, 0);
		routeTestU16(cd, 0); routeTestU16(cd, 0); routeTestU32(cd, 0); routeTestU32(cd, offset);
		central.push(new Uint8Array(cd), nameBytes);
		offset += local.length + nameBytes.length + bytes.length;
	}
	const centralOffset = offset;
	let centralSize = 0;
	for (const c of central) centralSize += c.length;
	const end = [];
	routeTestU32(end, 0x06054b50);
	routeTestU16(end, 0); routeTestU16(end, 0);
	routeTestU16(end, files.length); routeTestU16(end, files.length);
	routeTestU32(end, centralSize); routeTestU32(end, centralOffset); routeTestU16(end, 0);
	return new Blob([...chunks, ...central, new Uint8Array(end)], { type: 'application/zip' });
}

async function routeTestDownloadScreenshots(clearAfter = false) {
	const shots = routeStressScreenshots.slice();
	if (!shots.length) {
		console.warn('route-stress: no screenshots to save');
		return;
	}
	const files = shots.map((shot) => ({ name: shot.filename, blob: shot.blob }));
	const zip = await routeTestCreateZip(files);
	const url = URL.createObjectURL(zip);
	const a = document.createElement('a');
	const stamp = new Date().toISOString().replace(/[:.]/g, '-');
	const first = String(shots[0].index).padStart(4, '0');
	const last = String(shots[shots.length - 1].index).padStart(4, '0');
	a.href = url;
	a.download = `route-stress-shots-${first}-${last}-${stamp}.zip`;
	document.body.appendChild(a);
	a.click();
	a.remove();
	URL.revokeObjectURL(url);
	if (clearAfter) {
		routeStressScreenshots = [];
		window.routeStressScreenshots = routeStressScreenshots;
	}
}

function routeTestShowResult(d, vg, endpoints, routeResult) {
	data = d;
	visibilityGraph = vg;
	render(data);
	routeEndpoints = [endpoints.start, endpoints.goal];
	const layer = document.getElementById('routeLayer');
	if (layer) layer.remove();
	const g = document.createElementNS(SVGNS, 'g');
	g.id = 'routeLayer';
	g.setAttribute('pointer-events', 'none');
	drawComputedRoute(g, routeResult);
	vp.appendChild(g);
}

function routeTestRecordFromResult(run, seed, settings, generationMs, navMeshMs, pathfindingMs, retries, pair, routeResult, status, rejectionCounts = null, screenshot = null, extra = {}) {
	const lengths = routeResult ? routeResult.routeLengthSlots : emptyRouteSlots();
	const sides = routeResult ? routeResult.routeSideSlots : emptyRouteSlots();
	const sideLabels = routeResult ? routeResult.routeSideLabelSlots : emptyRouteSlots();
	const counts = rejectionCounts || { distinct: 0, distance: 0, side: 0 };
	// Each failed (route-rejected) attempt as "sx,sy>gx,gy:reason[:timeout]";
	// entries separated by ';' so the whole list fits one CSV cell and any
	// weird pair can be pasted straight back into a route to reproduce it.
	const failed = extra.failedAttempts || [];
	const failedAttempts = failed
		.map((a) => `${a.sx.toFixed(6)},${a.sy.toFixed(6)}>${a.gx.toFixed(6)},${a.gy.toFixed(6)}:${a.reason}${a.timeout ? ':timeout' : ''}`)
		.join(';');
	// A* time (ms) of every attempt, final success last; '|'-separated.
	const pathfindingMsByRetry = (extra.pathfindingMsByRetry || []).join('|');
	return {
		run,
		seed,
		status,
		screenshotIndex: screenshot ? screenshot.index : '',
		screenshotFile: screenshot ? screenshot.filename : '',
		size: settings ? settings.size : '',
		river: settings ? settings.river : '',
		shore: settings ? settings.coast : '',
		walls: settings ? settings.walls : '',
		retries,
		rejectDistinct: counts.distinct,
		rejectDistance: counts.distance,
		rejectSide: counts.side,
		timeout: extra.timeoutCount || 0,
		cityGenerationMs: Number(generationMs.toFixed(3)),
		navMeshGenerationMs: Number(navMeshMs.toFixed(3)),
		pathfindingUntilFoundMs: Number(pathfindingMs.toFixed(3)),
		pathfindingMsByRetry,
		startX: pair ? Number(pair.start.x.toFixed(6)) : '',
		startY: pair ? Number(pair.start.y.toFixed(6)) : '',
		startWardType: pair ? pair.start.wardType : '',
		startArea: pair ? pair.start.area : '',
		goalX: pair ? Number(pair.goal.x.toFixed(6)) : '',
		goalY: pair ? Number(pair.goal.y.toFixed(6)) : '',
		goalWardType: pair ? pair.goal.wardType : '',
		goalArea: pair ? pair.goal.area : '',
		straightLineDistance: pair ? Number(pair.straightLine.toFixed(3)) : '',
		selectedRouteIndexes: routeResult ? routeResult.routeIndexes.join('|') : '',
		route1Length: lengths[0] == null ? '' : Number(lengths[0].toFixed(3)),
		route2Length: lengths[1] == null ? '' : Number(lengths[1].toFixed(3)),
		route3Length: lengths[2] == null ? '' : Number(lengths[2].toFixed(3)),
		route4Length: lengths[3] == null ? '' : Number(lengths[3].toFixed(3)),
		route1Side: sides[0] == null ? '' : Number(sides[0].toFixed(6)),
		route2Side: sides[1] == null ? '' : Number(sides[1].toFixed(6)),
		route3Side: sides[2] == null ? '' : Number(sides[2].toFixed(6)),
		route4Side: sides[3] == null ? '' : Number(sides[3].toFixed(6)),
		route1SideLabel: sideLabels[0] || '',
		route2SideLabel: sideLabels[1] || '',
		route3SideLabel: sideLabels[2] || '',
		route4SideLabel: sideLabels[3] || '',
		candidateRouteLengths: routeResult ? routeResult.paths.slice(0, ROUTE_STRESS_ALTERNATE_ATTEMPTS).map((p) => Number(p.len.toFixed(3))).join('|') : '',
		reason: routeResult ? routeResult.reason : status,
		failedAttempts,
	};
}

async function runRouteStressTest(maxRuns = ROUTE_STRESS_MAX_RUNS) {
	if (routeStressRunning) {
		routeStressAbort = true;
		return;
	}
	routeStressRunning = true;
	routeStressAbort = false;
	routeStressLog = [];
	routeStressScreenshots = [];
	window.routeStressLog = routeStressLog;
	window.routeStressScreenshots = routeStressScreenshots;
	$('routetest').textContent = 'stop stress';
	statusEl.textContent = 'route stress starting...';

	for (let run = 1; run <= maxRuns && !routeStressAbort; run++) {
		const seed = Math.floor(Math.random() * 2147483646) + 1;
		const settings = routeTestRandomSettings(seed);
		let d = null;
		let vg = null;
		let generationMs = 0;
		let navMeshMs = 0;
		try {
			const genStart = performance.now();
			d = generateWards(settings);
			generationMs = performance.now() - genStart;

			const navStart = performance.now();
			vg = buildVisibilityGraph(extractObstacles(d), ROUTE_VISIBILITY_GRAPH_OPTIONS);
			navMeshMs = performance.now() - navStart;
		} catch (e) {
			routeTestAppendLog(routeTestRecordFromResult(run, seed, settings, generationMs, navMeshMs, 0, 0, null, null, `generation-error:${e.message}`));
			continue;
		}

		const candidates = (d.wards || [])
			.filter((w) => !w.water && w.polygon && w.polygon.length >= 3)
			.map((ward) => ({ ward, bbox: routeTestWardBbox(ward) }));
		if (candidates.length === 0) {
			routeTestAppendLog(routeTestRecordFromResult(run, seed, settings, generationMs, navMeshMs, 0, 0, null, null, 'no-traversable-wards'));
			continue;
		}

		const routeStart = performance.now();
		let retries = 0;
		let pair = null;
		let routeResult = null;
		const rejectionCounts = { distinct: 0, distance: 0, side: 0 };
		// Per-retry detail so weird cases stay reproducible: each route-rejected
		// attempt's start/goal + reason + whether A* timed out, the A* time of
		// every attempt (incl. the final success), and a timeout tally.
		const failedAttempts = [];
		const pathfindingMsByRetry = [];
		let timeoutCount = 0;
		while (!routeStressAbort) {
			pair = routeTestPickPair(candidates, vg, d.wall, rejectionCounts);
			if (!pair) {
				rejectionCounts.distance++;
				retries++;
				if (retries % ROUTE_STRESS_ROUTE_ATTEMPT_PAUSE === 0) await new Promise((resolve) => setTimeout(resolve, 0));
				continue;
			}
			routeResult = computeRouteOptions(pair.start, pair.goal, vg);
			pathfindingMsByRetry.push(Number(routeResult.dt.toFixed(3)));
			if (routeResult.timeout) timeoutCount++;
			if (routeResult.ok) break;
			failedAttempts.push({
				sx: pair.start.x, sy: pair.start.y, gx: pair.goal.x, gy: pair.goal.y,
				reason: routeResult.reason, timeout: routeResult.timeout,
			});
			if (routeResult.reason === 'timeout') {
				if (!routeResult.timeout) timeoutCount++;
			}
			else if (routeResult.reason === 'distinct') rejectionCounts.distinct++;
			else if (routeResult.reason === 'distance') rejectionCounts.distance++;
			else rejectionCounts.side++;
			retries++;
			if (retries % ROUTE_STRESS_ROUTE_ATTEMPT_PAUSE === 0) await new Promise((resolve) => setTimeout(resolve, 0));
		}
		const pathfindingMs = performance.now() - routeStart;
		if (routeStressAbort) break;

		routeTestShowResult(d, vg, pair, routeResult);
		let screenshot = null;
		try {
			screenshot = await routeTestCaptureScreenshot(run, pair, routeResult);
		} catch (e) {
			console.warn('route-stress: screenshot capture failed', e);
		}
		const record = routeTestRecordFromResult(run, seed, settings, generationMs, navMeshMs, pathfindingMs, retries, pair, routeResult, 'ok', rejectionCounts, screenshot, { failedAttempts, pathfindingMsByRetry, timeoutCount });
		routeTestAppendLog(record);
		if (routeStressScreenshots.length >= ROUTE_STRESS_EXPORT_EVERY) await routeTestDownloadScreenshots(true);
		statusEl.textContent = `route stress ${run}/${maxRuns} · retries ${retries} · seed ${seed} · size ${settings.size} · river ${settings.river ? 'on' : 'off'} · shore ${settings.coast ? 'on' : 'off'} · walls ${settings.walls ? 'on' : 'off'}`;
		await new Promise((resolve) => setTimeout(resolve, 0));
	}

	routeStressRunning = false;
	routeStressAbort = false;
	$('routetest').textContent = 'route stress';
	statusEl.textContent = `route stress stopped · ${routeStressLog.length} records`;
	console.log(`route-stress: stopped after ${routeStressLog.length} records; use window.routeStressLog or Save Route Log`);
}

window.runRouteStressTest = runRouteStressTest;
window.saveRouteStressLog = routeTestDownloadLog;
window.saveRouteStressScreenshots = routeTestDownloadScreenshots;
svg.addEventListener('click', (e) => {
	if (!$('routemode').checked) return;
	if (e.detail > 2) return; // triple+ clicks: ignore
	const w = screenToWorld(e.clientX, e.clientY);
	if (routeEndpoints.length >= 2) routeEndpoints = [];
	routeEndpoints.push(w);
	const label = routeEndpoints.length === 1 ? 'start' : 'goal';
	console.log(`route ${label}: x=${w.x.toFixed(6)}, y=${w.y.toFixed(6)}`, { x: w.x, y: w.y });
	if (routeEndpoints.length === 2) {
		console.log('route example:', {
			seed: $('seed').value,
			size: parseFloat($('size').value) || 15,
			options: {
				coast: $('coast').checked,
				river: $('river').checked,
				walls: $('walls').checked,
				streets: $('streets').checked,
				outerRatio: parseFloat($('outerratio').value) || 8,
				roadDensity: parseFloat($('roaddens').value) || 0,
				gates: parseInt($('gates').value, 10),
			},
			start: routeEndpoints[0],
			goal: routeEndpoints[1],
		});
	}
	drawRouteLayer();
});
svg.addEventListener('dblclick', () => {
	if (!$('routemode').checked) return;
	routeEndpoints = [];
	drawRouteLayer();
});
$('routemode').onchange = () => {
	svg.style.cursor = $('routemode').checked ? 'crosshair' : 'grab';
	if (!$('routemode').checked) { routeEndpoints = []; drawRouteLayer(); }
};
$('clearroute').onclick = () => { routeEndpoints = []; drawRouteLayer(); };
$('routetest').onclick = () => runRouteStressTest();
$('saveroutelog').onclick = () => routeTestDownloadLog();
$('saverouteshots').onclick = () => routeTestDownloadScreenshots();

$('gen').onclick = generate;
$('fit').onclick = () => fit();
$('rnd').onclick = () => { $('seed').value = Math.floor(Math.random() * 2147483646) + 1; generate(); };
$('size').oninput = () => { $('sizeval').textContent = $('size').value; };
$('outerratio').oninput = () => { $('outerratioval').textContent = `${$('outerratio').value}x`; generate(); };
$('roaddens').oninput = () => { $('roaddensval').textContent = $('roaddens').value; generate(); };
$('plaza').onchange = generate;
$('coast').onchange = generate;
$('river').onchange = generate;
$('walls').onchange = generate;
$('streets').onchange = generate;
$('gates').onchange = generate;
$('gates').oninput = generate;
$('seeds').onchange = () => { if (data) render(data); drawRouteLayer(); };
$('obstacles').onchange = () => { if (data) render(data); drawRouteLayer(); };
generate();
</script>
